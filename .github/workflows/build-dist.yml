name: Build Downloads distribution

on:
  push:
    branches:
      - downloads_1.3.0
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: downloads_1.3.0
          fetch-depth: 0

      - name: Build clean installable archive
        shell: bash
        run: |
          set -euo pipefail

          archive="dist/downloads_1.3.0_2.1.2.zip"
          rm -rf dist
          mkdir -p dist

          mapfile -t files < <(
            find . -type f               ! -path './.git/*'               ! -path './dist/*'               ! -path '*/.*'               -print             | sed 's#^\./##'             | LC_ALL=C sort
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No files selected for packaging."
            exit 1
          fi

          printf '%s\n' "${files[@]}" | zip -X -q "$archive" -@

          echo "Archive entries:"
          zipinfo -1 "$archive"

      - name: Verify distribution archive
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/downloads_1.3.0_2.1.2.zip"

          test -s "$archive"

          bad_entries="$(zipinfo -1 "$archive" | awk -F/ '
            {
              for (i = 1; i <= NF; i++) {
                if ($i ~ /^\./) {
                  print $0
                  break
                }
              }
            }
          ')"

          if [ -n "$bad_entries" ]; then
            echo "Archive contains forbidden dot-prefixed path components:"
            printf '%s\n' "$bad_entries"
            exit 1
          fi

          if zipinfo -1 "$archive" | grep -q '^dist/'; then
            echo "Archive must not contain dist/."
            exit 1
          fi

          for required in autoinstall.php functions.inc install_defaults.php plugin.json public_html/index.php; do
            if ! zipinfo -1 "$archive" | grep -Fxq "$required"; then
              echo "Missing required installable file: $required"
              exit 1
            fi
          done

      - name: Commit distribution archive
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f dist/downloads_1.3.0_2.1.2.zip

          if git diff --cached --quiet; then
            echo "Distribution archive is already up to date."
            exit 0
          fi

          git commit -m "build: refresh Downloads 1.3.0 distribution"
          git push origin HEAD:downloads_1.3.0
